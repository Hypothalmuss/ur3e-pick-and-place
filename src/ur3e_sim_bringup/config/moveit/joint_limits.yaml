# Position limits keep the planner inside one sane working branch. The UR3e URDF
# allows +/-2*pi on every joint, which let the planner pick wrapped-around and
# elbow-flipped configurations - the arm would fold onto itself or take a long way
# round between two nearby poses. Everything below is a superset of the poses the
# pick-and-place cycle actually needs (HOME is 0, -1.5707, 0, -1.5707, 0, 0).
#
# Velocities were 0.35/0.5 rad/s, which made a single cycle take minutes - an
# APPROACH alone measured 53 s and a retract 74 s, slow enough that test
# harnesses timed out and commands were refused as busy. They were set that low
# for a friction grasp that could be shaken loose; the grasp is a rigid plugin
# attach now, so the carry no longer has to be gentle. Cartesian segments are
# paced by these limits alone (Humble's GetCartesianPath has no scaling field).
joint_limits:
  shoulder_pan_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_velocity_limits: true
    max_velocity: 1.8
    has_acceleration_limits: true
    max_acceleration: 3.0
  # Upper arm stays at or above horizontal - it never swings down and behind.
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 0.0
    has_velocity_limits: true
    max_velocity: 1.8
    has_acceleration_limits: true
    max_acceleration: 3.0
  elbow_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_velocity_limits: true
    max_velocity: 1.8
    has_acceleration_limits: true
    max_acceleration: 3.0
  wrist_1_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_velocity_limits: true
    max_velocity: 2.5
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_velocity_limits: true
    max_velocity: 2.5
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position: 3.14159
    has_velocity_limits: true
    max_velocity: 2.5
    has_acceleration_limits: true
    max_acceleration: 5.0
