controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
      # trajectory: 0.0 disables the mid-motion state-tolerance check (it was
      # aborting direct-joint IK-fallback moves); a generous goal tolerance is
      # still enforced at the end of each trajectory.
      shoulder_pan_joint:
        goal: 0.1
        trajectory: 0.0
      shoulder_lift_joint:
        goal: 0.1
        trajectory: 0.0
      elbow_joint:
        goal: 0.1
        trajectory: 0.0
      wrist_1_joint:
        goal: 0.1
        trajectory: 0.0
      wrist_2_joint:
        goal: 0.1
        trajectory: 0.0
      wrist_3_joint:
        goal: 0.1
        trajectory: 0.0

gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
